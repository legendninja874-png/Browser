  <body>
    <div id="root"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('[EoN] Service Worker registered:', reg.scope);
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[EoN] New version available — reload to update');
                  }
                });
              });
            })
            .catch((err) => console.warn('[EoN] SW registration failed:', err));
        });
      }

      // Capture PWA install prompt for in-app install button
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__eonInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('eon-pwa-installable'));
      });

      window.addEventListener('appinstalled', () => {
        console.log('[EoN] App installed successfully');
        window.__eonInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('eon-pwa-installed'));
      });
    </script>
  </body>
