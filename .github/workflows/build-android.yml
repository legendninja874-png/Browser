name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm --filter @workspace/eon-browser run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Write local.properties
        working-directory: artifacts/eon-browser/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Sync Capacitor (copies web assets)
        working-directory: artifacts/eon-browser
        run: pnpm exec cap sync android

      - name: Copy app icons to Android resources
        run: node scripts/copy-android-icons.mjs

      - name: Make gradlew executable
        working-directory: artifacts/eon-browser/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: artifacts/eon-browser/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EoN-Browser-APK
          path: artifacts/eon-browser/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
