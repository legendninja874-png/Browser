kind = "web"
previewPath = "/"
title = "EoN Browser"
version = "1.0.0"
id = "artifacts/eon-browser"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22144

[services.development]
run = "pnpm --filter @workspace/eon-browser run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eon-browser", "run", "build" ]
publicDir = "artifacts/eon-browser/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22144"
BASE_PATH = "/"
