services:
  - type: web
    name: eon-browser
    runtime: node
    region: oregon
    plan: free
    buildCommand: >
      pnpm install &&
      pnpm --filter @workspace/eon-browser run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: NODE_ENV=production pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /api/healthz
