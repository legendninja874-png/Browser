services:
  - type: web
    name: eon-browser
    runtime: node
    region: oregon
    plan: free
    buildCommand: >
      npm install -g pnpm@10.26.1 &&
      pnpm install &&
      pnpm --filter @workspace/eon-browser run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 20.20.0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /api/healthz
